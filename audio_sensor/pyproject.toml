[project]
name = "audio-sensor"
version = "0.1.0"
description = "FastAPI service that transcribes English audio with WhisperX and mutes or beeps out profanity."
readme = "README.md"
authors = [
    { name = "Raman Mehta", email = "raman.mehta@fiftyfivetech.io" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "audioop-lts>=0.2.2",
    "better-profanity>=0.7.0",
    "email-validator>=2.3.0",
    "fastapi[all]>=0.162.4",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.2",
    "pydub>=0.25.1",
    "pyjwt>=2.15.1",
    "scalar-fastapi>=1.10.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlmodel>=0.0.50",
    "whisperx>=3.8.4",
]
